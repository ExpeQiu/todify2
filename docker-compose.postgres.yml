version: '3.8'

# PostgreSQL 版本的 docker-compose 配置
# 使用方式: docker-compose -f docker-compose.yml -f docker-compose.postgres.yml up -d

services:
  backend:
    environment:
      - DB_TYPE=postgresql
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-postgres}
      - PG_PASSWORD=${PG_PASSWORD:-postgres}
      - PG_DATABASE=${PG_DATABASE:-todify3}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    profiles: []  # 移除 profile，使其总是启动
