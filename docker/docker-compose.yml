services:
  # 后端服务
  backend:
    image: todify4-backend:latest
    container_name: todify4-backend
    restart: unless-stopped
    ports:
      - "8113:8113"
    environment:
      # 数据库初始化配置
      - INIT_DATABASE=${INIT_DATABASE:-1}
      - FORCE_INIT=${FORCE_INIT:-0}
      - DATA_DIR=/app/data
      - INIT_DATA_DIR=/app/init-data
      # 应用配置
      - NODE_ENV=production
      - PORT=8113
      # 数据库配置（使用 SQLite）
      - DB_TYPE=${DB_TYPE:-sqlite}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-./data/todify4.db}
      # PostgreSQL 配置（如果使用 PostgreSQL）
      - PG_HOST=${PG_HOST:-todify4-postgres}
      - PG_PORT=${PG_PORT:-5432}
      - PG_USER=${PG_USER:-postgres}
      - PG_PASSWORD=${PG_PASSWORD:-postgres}
      - PG_DATABASE=${PG_DATABASE:-todify4}
      # Dify API 配置（可选）
      - DIFY_BASE_URL=${DIFY_BASE_URL:-}
      - DIFY_WORKFLOW_BASE_URL=${DIFY_WORKFLOW_BASE_URL:-}
      - AI_SEARCH_API_KEY=${AI_SEARCH_API_KEY:-}
      - TECH_PACKAGE_API_KEY=${TECH_PACKAGE_API_KEY:-}
      - TECH_STRATEGY_API_KEY=${TECH_STRATEGY_API_KEY:-}
      - TECH_ARTICLE_API_KEY=${TECH_ARTICLE_API_KEY:-}
      - TECH_PUBLISH_API_KEY=${TECH_PUBLISH_API_KEY:-}
      # 博查 API 配置（可选）
      - BOCHA_API_KEY=${BOCHA_API_KEY:-}
    volumes:
      # 挂载数据目录（SQLite 数据库文件）
      - ../backend/data:/app/data
      # 挂载上传文件目录
      - ../backend/uploads:/app/uploads
      # 挂载历史数据目录（用于导入历史数据）
      - ../backend/init-data:/app/init-data:ro
    networks:
      - todify4-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8113/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # 前端服务
  frontend:
    image: todify4-frontend:latest
    container_name: todify4-frontend
    restart: unless-stopped
    ports:
      - "8111:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todify4-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: todify4-nginx
    restart: unless-stopped
    ports:
      - "8118:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - todify4-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # PostgreSQL 数据库（可选，如果使用 PostgreSQL）
  postgres:
    image: postgres:15-alpine
    container_name: todify4-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PG_USER:-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-postgres}
      - POSTGRES_DB=${PG_DATABASE:-todify4}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${PG_EXTERNAL_PORT:-5432}:5432"
    networks:
      - todify4-network
    profiles:
      - postgres  # 只有在使用 postgres profile 时才启动
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local

networks:
  todify4-network:
    driver: bridge
