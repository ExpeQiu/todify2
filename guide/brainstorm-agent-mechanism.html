<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多Agent头脑风暴机制图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 40px;
            font-size: 16px;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .node:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
        }
        
        .node-text {
            font-size: 12px;
            font-weight: 500;
            fill: #2d3748;
            text-anchor: middle;
            pointer-events: none;
        }
        
        .node-title {
            font-size: 14px;
            font-weight: 600;
            fill: #1a202c;
            text-anchor: middle;
            pointer-events: none;
        }
        
        .edge {
            stroke: #718096;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        
        .edge-dashed {
            stroke-dasharray: 5,5;
            stroke: #a0aec0;
        }
        
        .flow-label {
            font-size: 11px;
            fill: #4a5568;
            font-weight: 500;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            fill: #2d3748;
            text-anchor: middle;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            max-width: 300px;
        }
        
        .tooltip.show {
            opacity: 1;
        }
        
        .mode-badge {
            font-size: 10px;
            fill: white;
            font-weight: 600;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>多Agent头脑风暴机制架构图</h1>
        <p class="subtitle">展示完整的Agent协作流程、核心功能模块和讨论模式</p>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #667eea;"></div>
                <span>核心编排器</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #764ba2;"></div>
                <span>功能管理器</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #f093fb;"></div>
                <span>讨论模式</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #4facfe;"></div>
                <span>Agent执行</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #43e97b;"></div>
                <span>数据存储</span>
            </div>
        </div>
        
        <svg viewBox="0 0 1400 1800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#718096" />
                </marker>
                <linearGradient id="orchestratorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="managerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#764ba2;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="modeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#fa709a;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <!-- 标题区域 -->
            <text x="700" y="30" class="section-title">多Agent头脑风暴系统架构</text>
            
            <!-- 核心编排器 -->
            <g class="node" data-tooltip="BrainstormOrchestrator: 核心编排器，负责协调所有讨论流程">
                <rect x="550" y="60" width="300" height="80" rx="8" fill="url(#orchestratorGrad)" stroke="#4a5568" stroke-width="2"/>
                <text x="700" y="95" class="node-title">BrainstormOrchestrator</text>
                <text x="700" y="115" class="node-text">核心编排器</text>
                <text x="700" y="130" class="node-text">讨论循环控制</text>
            </g>
            
            <!-- 功能管理器区域 -->
            <text x="700" y="200" class="section-title">核心功能模块</text>
            
            <!-- StructuredContextManager -->
            <g class="node" data-tooltip="结构化上下文管理器: 压缩历史消息，提取关键观点，减少Token消耗50-70%">
                <rect x="80" y="230" width="220" height="120" rx="8" fill="url(#managerGrad)" stroke="#4a5568" stroke-width="2"/>
                <text x="190" y="260" class="node-title">StructuredContext</text>
                <text x="190" y="280" class="node-title">Manager</text>
                <text x="190" y="300" class="node-text">• 消息压缩摘要</text>
                <text x="190" y="315" class="node-text">• 关键观点提取</text>
                <text x="190" y="330" class="node-text">• 分歧点检测</text>
            </g>
            
            <!-- ReflectionLoopManager -->
            <g class="node" data-tooltip="评审-反思循环管理器: 5维度质量评审，生成改进建议，提升质量20-30%">
                <rect x="340" y="230" width="220" height="120" rx="8" fill="url(#managerGrad)" stroke="#4a5568" stroke-width="2"/>
                <text x="450" y="260" class="node-title">ReflectionLoop</text>
                <text x="450" y="280" class="node-title">Manager</text>
                <text x="450" y="300" class="node-text">• 质量评审</text>
                <text x="450" y="315" class="node-text">• 反思分析</text>
                <text x="450" y="330" class="node-text">• 迭代优化</text>
            </g>
            
            <!-- ConsensusDetector -->
            <g class="node" data-tooltip="共识检测器: 语义分析+投票机制，自动检测共识，收敛率85%+">
                <rect x="600" y="230" width="220" height="120" rx="8" fill="url(#managerGrad)" stroke="#4a5568" stroke-width="2"/>
                <text x="710" y="260" class="node-title">ConsensusDetector</text>
                <text x="710" y="280" class="node-title"></text>
                <text x="710" y="300" class="node-text">• 语义分析</text>
                <text x="710" y="315" class="node-text">• 投票机制</text>
                <text x="710" y="330" class="node-text">• 自动收敛</text>
            </g>
            
            <!-- DebateModeManager -->
            <g class="node" data-tooltip="辩论模式管理器: 正反方交替发言，裁判评判，提升讨论深度40%+">
                <rect x="860" y="230" width="220" height="120" rx="8" fill="url(#managerGrad)" stroke="#4a5568" stroke-width="2"/>
                <text x="970" y="260" class="node-title">DebateMode</text>
                <text x="970" y="280" class="node-title">Manager</text>
                <text x="970" y="300" class="node-text">• 正反方分组</text>
                <text x="970" y="315" class="node-text">• 交替发言</text>
                <text x="970" y="330" class="node-text">• 裁判评判</text>
            </g>
            
            <!-- 连接线：管理器到编排器 -->
            <line x1="190" y1="230" x2="650" y2="100" class="edge"/>
            <line x1="450" y1="230" x2="650" y2="100" class="edge"/>
            <line x1="710" y1="230" x2="700" y2="100" class="edge"/>
            <line x1="970" y1="230" x2="750" y2="100" class="edge"/>
            
            <!-- 讨论模式区域 -->
            <text x="700" y="420" class="section-title">讨论模式</text>
            
            <!-- Parallel Mode -->
            <g class="node" data-tooltip="并行模式: 所有Agent同时发言，快速收集观点">
                <rect x="200" y="450" width="200" height="100" rx="8" fill="url(#modeGrad)" stroke="#4a5568" stroke-width="2"/>
                <text x="300" y="480" class="node-title">Parallel Mode</text>
                <text x="300" y="500" class="node-text">并行执行</text>
                <text x="300" y="515" class="node-text">所有Agent同时发言</text>
                <text x="300" y="530" class="node-text">快速收集观点</text>
            </g>
            
            <!-- Round-Robin Mode -->
            <g class="node" data-tooltip="轮流模式: Agent按顺序依次发言，观点逐步深入">
                <rect x="450" y="450" width="200" height="100" rx="8" fill="url(#modeGrad)" stroke="#4a5568" stroke-width="2"/>
                <text x="550" y="480" class="node-title">Round-Robin Mode</text>
                <text x="550" y="500" class="node-text">轮流发言</text>
                <text x="550" y="515" class="node-text">按顺序依次发言</text>
                <text x="550" y="530" class="node-text">观点逐步深入</text>
            </g>
            
            <!-- Debate Mode -->
            <g class="node" data-tooltip="辩论模式: 正反方交替发言，裁判评判，深度辩论">
                <rect x="700" y="450" width="200" height="100" rx="8" fill="url(#modeGrad)" stroke="#4a5568" stroke-width="2"/>
                <text x="800" y="480" class="node-title">Debate Mode</text>
                <text x="800" y="500" class="node-text">辩论模式</text>
                <text x="800" y="515" class="node-text">正反方交替</text>
                <text x="800" y="530" class="node-text">裁判评判</text>
            </g>
            
            <!-- 连接线：模式到编排器 -->
            <line x1="300" y1="450" x2="600" y2="140" class="edge"/>
            <line x1="550" y1="450" x2="700" y2="140" class="edge"/>
            <line x1="800" y1="450" x2="800" y2="140" class="edge"/>
            
            <!-- Agent执行层 -->
            <text x="700" y="620" class="section-title">Agent执行层</text>
            
            <!-- AgentOrchestrator -->
            <g class="node" data-tooltip="AgentOrchestrator: 执行Direct Agent，管理Prompt、Context、Tool">
                <rect x="500" y="650" width="400" height="80" rx="8" fill="#4facfe" stroke="#2c5282" stroke-width="2"/>
                <text x="700" y="680" class="node-title">AgentOrchestrator</text>
                <text x="700" y="700" class="node-text">执行Agent • 管理上下文 • 工具调用</text>
                <text x="700" y="715" class="node-text">支持Function Calling • 多轮对话</text>
            </g>
            
            <!-- 连接线：编排器到Agent执行 -->
            <line x1="700" y1="140" x2="700" y2="650" class="edge"/>
            <text x="720" y="400" class="flow-label">执行Agent</text>
            
            <!-- Agent实例 -->
            <g class="node" data-tooltip="Agent实例: 多个专家Agent参与讨论">
                <rect x="200" y="780" width="150" height="80" rx="8" fill="#43e97b" stroke="#2d5016" stroke-width="2"/>
                <text x="275" y="810" class="node-title">Agent 1</text>
                <text x="275" y="830" class="node-text">专家角色</text>
                <text x="275" y="845" class="node-text">观点生成</text>
            </g>
            
            <g class="node" data-tooltip="Agent实例: 多个专家Agent参与讨论">
                <rect x="400" y="780" width="150" height="80" rx="8" fill="#43e97b" stroke="#2d5016" stroke-width="2"/>
                <text x="475" y="810" class="node-title">Agent 2</text>
                <text x="475" y="830" class="node-text">专家角色</text>
                <text x="475" y="845" class="node-text">观点生成</text>
            </g>
            
            <g class="node" data-tooltip="Agent实例: 多个专家Agent参与讨论">
                <rect x="600" y="780" width="150" height="80" rx="8" fill="#43e97b" stroke="#2d5016" stroke-width="2"/>
                <text x="675" y="810" class="node-title">Agent 3</text>
                <text x="675" y="830" class="node-text">专家角色</text>
                <text x="675" y="845" class="node-text">观点生成</text>
            </g>
            
            <g class="node" data-tooltip="Agent实例: 多个专家Agent参与讨论">
                <rect x="800" y="780" width="150" height="80" rx="8" fill="#43e97b" stroke="#2d5016" stroke-width="2"/>
                <text x="875" y="810" class="node-title">Agent N</text>
                <text x="875" y="830" class="node-text">专家角色</text>
                <text x="875" y="845" class="node-text">观点生成</text>
            </g>
            
            <!-- 连接线：AgentOrchestrator到Agent -->
            <line x1="600" y1="730" x2="275" y2="780" class="edge"/>
            <line x1="650" y1="730" x2="475" y2="780" class="edge"/>
            <line x1="700" y1="730" x2="675" y2="780" class="edge"/>
            <line x1="750" y1="730" x2="875" y2="780" class="edge"/>
            
            <!-- 数据流区域 -->
            <text x="700" y="920" class="section-title">数据流与存储</text>
            
            <!-- 消息流 -->
            <g class="node" data-tooltip="消息流: Agent发言 → 消息存储 → 上下文构建">
                <rect x="150" y="950" width="250" height="100" rx="8" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
                <text x="275" y="980" class="node-title">消息流</text>
                <text x="275" y="1000" class="node-text">Agent发言</text>
                <text x="275" y="1015" class="node-text">→ 消息存储</text>
                <text x="275" y="1030" class="node-text">→ 上下文构建</text>
            </g>
            
            <!-- 结构化上下文 -->
            <g class="node" data-tooltip="结构化上下文: 压缩摘要、关键观点、分歧点、共识">
                <rect x="450" y="950" width="250" height="100" rx="8" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
                <text x="575" y="980" class="node-title">结构化上下文</text>
                <text x="575" y="1000" class="node-text">压缩摘要</text>
                <text x="575" y="1015" class="node-text">关键观点提取</text>
                <text x="575" y="1030" class="node-text">分歧/共识检测</text>
            </g>
            
            <!-- 评审反思 -->
            <g class="node" data-tooltip="评审反思: 质量评分、改进建议、迭代优化">
                <rect x="750" y="950" width="250" height="100" rx="8" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
                <text x="875" y="980" class="node-title">评审反思</text>
                <text x="875" y="1000" class="node-text">质量评分</text>
                <text x="875" y="1015" class="node-text">改进建议</text>
                <text x="875" y="1030" class="node-text">迭代优化</text>
            </g>
            
            <!-- 连接线：Agent到消息流 -->
            <line x1="275" y1="860" x2="275" y2="950" class="edge"/>
            <line x1="475" y1="860" x2="275" y2="950" class="edge"/>
            <line x1="675" y1="860" x2="575" y2="950" class="edge"/>
            <line x1="875" y1="860" x2="875" y2="950" class="edge"/>
            
            <!-- 连接线：消息流到结构化上下文 -->
            <line x1="400" y1="1000" x2="450" y2="1000" class="edge"/>
            
            <!-- 连接线：结构化上下文到评审反思 -->
            <line x1="700" y1="1000" x2="750" y2="1000" class="edge"/>
            
            <!-- 数据库存储 -->
            <g class="node" data-tooltip="数据库存储: Session、Participant、Message、Summary">
                <rect x="500" y="1100" width="400" height="100" rx="8" fill="#10b981" stroke="#065f46" stroke-width="2"/>
                <text x="700" y="1130" class="node-title">数据库存储</text>
                <text x="700" y="1150" class="node-text">Session • Participant • Message • Summary</text>
                <text x="700" y="1165" class="node-text">持久化所有讨论数据</text>
                <text x="700" y="1180" class="node-text">支持查询和回溯</text>
            </g>
            
            <!-- 连接线：数据流到数据库 -->
            <line x1="275" y1="1050" x2="600" y2="1100" class="edge-dashed"/>
            <line x1="575" y1="1050" x2="650" y2="1100" class="edge-dashed"/>
            <line x1="875" y1="1050" x2="800" y2="1100" class="edge-dashed"/>
            
            <!-- 工作流程区域 -->
            <text x="700" y="1250" class="section-title">工作流程</text>
            
            <!-- 流程步骤 -->
            <g class="node" data-tooltip="步骤1: 创建会话，配置讨论模式和参数">
                <rect x="100" y="1280" width="180" height="80" rx="8" fill="#ec4899" stroke="#831843" stroke-width="2"/>
                <text x="190" y="1310" class="node-title">1. 创建会话</text>
                <text x="190" y="1325" class="node-text">配置模式</text>
                <text x="190" y="1340" class="node-text">选择Agent</text>
            </g>
            
            <g class="node" data-tooltip="步骤2: 启动讨论循环，执行讨论轮次">
                <rect x="320" y="1280" width="180" height="80" rx="8" fill="#ec4899" stroke="#831843" stroke-width="2"/>
                <text x="410" y="1310" class="node-title">2. 执行轮次</text>
                <text x="410" y="1325" class="node-text">Agent发言</text>
                <text x="410" y="1340" class="node-text">生成观点</text>
            </g>
            
            <g class="node" data-tooltip="步骤3: 构建结构化上下文，压缩历史消息">
                <rect x="540" y="1280" width="180" height="80" rx="8" fill="#ec4899" stroke="#831843" stroke-width="2"/>
                <text x="630" y="1310" class="node-title">3. 上下文构建</text>
                <text x="630" y="1325" class="node-text">压缩摘要</text>
                <text x="630" y="1340" class="node-text">提取关键点</text>
            </g>
            
            <g class="node" data-tooltip="步骤4: 评审质量，反思改进">
                <rect x="760" y="1280" width="180" height="80" rx="8" fill="#ec4899" stroke="#831843" stroke-width="2"/>
                <text x="850" y="1310" class="node-title">4. 评审反思</text>
                <text x="850" y="1325" class="node-text">质量评分</text>
                <text x="850" y="1340" class="node-text">改进建议</text>
            </g>
            
            <g class="node" data-tooltip="步骤5: 检测共识，判断是否收敛">
                <rect x="980" y="1280" width="180" height="80" rx="8" fill="#ec4899" stroke="#831843" stroke-width="2"/>
                <text x="1070" y="1310" class="node-title">5. 共识检测</text>
                <text x="1070" y="1325" class="node-text">语义分析</text>
                <text x="1070" y="1340" class="node-text">投票统计</text>
            </g>
            
            <!-- 流程连接线 -->
            <line x1="280" y1="1320" x2="320" y2="1320" class="edge"/>
            <line x1="500" y1="1320" x2="540" y2="1320" class="edge"/>
            <line x1="720" y1="1320" x2="760" y2="1320" class="edge"/>
            <line x1="940" y1="1320" x2="980" y2="1320" class="edge"/>
            
            <!-- 循环箭头 -->
            <path d="M 1070 1360 Q 1100 1400 700 1400 Q 300 1400 190 1320" 
                  stroke="#ec4899" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
            <text x="700" y="1395" class="flow-label">继续讨论 / 达成共识停止</text>
            
            <!-- 最终输出 -->
            <g class="node" data-tooltip="最终输出: 讨论总结、共识主题、关键观点">
                <rect x="500" y="1450" width="400" height="100" rx="8" fill="#8b5cf6" stroke="#5b21b6" stroke-width="2"/>
                <text x="700" y="1480" class="node-title">最终输出</text>
                <text x="700" y="1500" class="node-text">讨论总结 • 共识主题 • 关键观点</text>
                <text x="700" y="1515" class="node-text">分歧点 • 改进建议</text>
                <text x="700" y="1530" class="node-text">可导出为Markdown/文本</text>
            </g>
            
            <!-- 连接线：流程到输出 -->

    <script>
        // 工具提示功能
        const tooltip = document.getElementById('tooltip');
        const nodes = document.querySelectorAll('.node');
        
        nodes.forEach(node => {
            const tooltipText = node.getAttribute('data-tooltip');
            if (!tooltipText) return;
            
            node.addEventListener('mouseenter', (e) => {
                const rect = node.getBoundingClientRect();
                tooltip.textContent = tooltipText;
                tooltip.style.left = (rect.left + rect.width / 2 - 150) + 'px';
                tooltip.style.top = (rect.top - 60) + 'px';
                tooltip.classList.add('show');
            });
            
            node.addEventListener('mouseleave', () => {
                tooltip.classList.remove('show');
            });
            
            node.addEventListener('mousemove', (e) => {
                tooltip.style.left = (e.clientX - 150) + 'px';
                tooltip.style.top = (e.clientY - 60) + 'px';
            });
        });
    </script>
